<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wanderly | Register</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
   <nav class="container">
  <a href="index.html" class="logo">Wanderly</a>

  <button class="menu-btn" id="menu-btn" aria-label="Toggle menu" aria-expanded="false">☰</button>

  <div class="nav-links" id="nav-links">
    <a href="index.html">Home</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="create-blog.html">Create Blog</a>
    <a href="login.html">Login</a>
    <a href="register.html" class="btn-link">Register</a>
  </div>
</nav>
  </header>

  <main class="container">
    <section class="auth-box">
      <h1>Create Account</h1>
      <p class="auth-sub">Join Wanderly and start sharing your travels.</p>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="Your name" required>
          <small class="error" id="name-error"></small>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
          <small class="error" id="email-error"></small>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="At least 6 characters" required>
          <small class="error" id="password-error"></small>
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" name="confirm-password" placeholder="Repeat your password" required>
          <small class="error" id="confirm-error"></small>
        </div>

        <p id="form-message" class="form-message"></p>
        <button type="submit" class="full-btn">Register</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
    </section>
  </main>

  <footer>
    <p>&copy; <span id="year">2026</span> Wanderly. Built with HTML, CSS, and JavaScript.</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
